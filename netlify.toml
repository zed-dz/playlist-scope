[build]
  command = "npm run build"
  publish = "dist"
  edge_functions = "netlify/edge-functions"

# Edge function registers its own path via export const config inside the file.
# SPA catch-all comes last so it doesn't swallow /api/* requests.

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false
